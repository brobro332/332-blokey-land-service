services:
  spring-boot-app:
    build:
      context: ../spring-boot-app
      dockerfile: Dockerfile
    container_name: spring-boot-app
    restart: always
    ports:
      - "${PORT}:${PORT}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:p6spy:postgresql://postgres:5432/${DATA_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${DATA_POSTGRES_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DATA_POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch-blokey:
        condition: service_healthy
    volumes:
      - spring-uploads:/app/uploads
    networks:
      - network-sentinel
    env_file:
      - .env

  nginx:
    build:
      context: ../react-app
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    ports:
      - "${NGINX_EXTERNAL_PORT}:${NGINX_INTERNAL_PORT}"
    depends_on:
      - spring-boot-app
    networks:
      - network-sentinel
    env_file:
      - .env

  postgres:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATA_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${DATA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DATA_POSTGRES_DB}
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:${POSTGRES_INTERNAL_PORT}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - network-sentinel
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATA_POSTGRES_USERNAME}"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  elasticsearch-blokey:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.9.0
    container_name: elasticsearch-blokey
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "${ELASTICSEARCH_EXTERNAL_PORT}:${ELASTICSEARCH_INTERNAL_PORT}"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - network-sentinel
    healthcheck:
      test: curl --silent --fail http://localhost:9200 || exit 1
      interval: 10s
      retries: 10
      start_period: 20s
      timeout: 5s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "${OLLAMA_EXTERNAL_PORT}:${OLLAMA_INTERNAL_PORT}"
    volumes:
      - oldata:/root/.ollama
    tty: true
    networks:
      - network-sentinel 
    restart: always

volumes:
  spring-uploads:
  pgdata:
  esdata:
  oldata:

networks:
  network-sentinel:
    external: true
