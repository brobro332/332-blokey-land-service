services:
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    environment:
      SONAR_JDBC_USERNAME: ${DATA_SONARQUBE_DB_USER}
      SONAR_JDBC_PASSWORD: ${DATA_SONARQUBE_DB_PASSWORD}
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/${DATA_SONARQUBE_DB}
    ports:
      - "${SONARQUBE_EXTERNAL_PORT}:${SONARQUBE_INTERNAL_PORT}"
    restart: unless-stopped
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_temp:/opt/sonarqube/temp
    networks:
      - network-sentinel
    env_file:
      - .env

  postgres-sonar:
    image: postgres:14
    container_name: postgres-sonar
    restart: always
    environment:
      POSTGRES_USER: ${DATA_SONARQUBE_DB_USER}
      POSTGRES_PASSWORD: ${DATA_SONARQUBE_DB_PASSWORD}
      POSTGRES_DB: ${DATA_SONARQUBE_DB}
    ports:
      - "${DATA_SONARQUBE_DB_EXTERNAL_PORT}:5432"
    volumes:
      - pgdata-sonar:/var/lib/postgresql/data
    networks:
      - network-sentinel
    env_file:
      - .env

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_temp:
  pgdata-sonar:

networks:
  network-sentinel:
    external: true