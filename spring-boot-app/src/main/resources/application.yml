server:
  port: ${PORT}
  address: ${ADDRESS}

spring:
  datasource:
    url: ${DATA_POSTGRES_URI}
    username: ${DATA_POSTGRES_USERNAME}
    password: ${DATA_POSTGRES_PASSWORD}
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.p6spy: DEBUG
    p6spy: DEBUG

file:
  upload-dir: ${FILE_UPLOAD_DIR}